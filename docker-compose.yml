services:
  mysql:
    image: mysql:8.4
    container_name: randomsitcom-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["deps", "full", "prod"]

  api:
    container_name: randomsitcom-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./apps/api:/repo/apps/api
      - ./packages/shared:/repo/packages/shared
      - ./packages/db:/repo/packages/db
      - /repo/apps/api/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/db/node_modules
    command: sh -lc "npm run db:generate && npm run dev -w @acme/api"
    profiles: ["full"]

  web:
    container_name: randomsitcom-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages/shared:/repo/packages/shared
      - ./packages/db:/repo/packages/db
      - /repo/apps/web/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/db/node_modules
    command: npm run dev -w web -- --host 0.0.0.0 --port 5173
    profiles: ["full"]

  api-prod:
    image: ghcr.io/theeidj/randomsitcomwebsite/api:latest
    container_name: randomsitcom-api-prod
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["prod"]

  web-prod:
    image: ghcr.io/theeidj/randomsitcomwebsite/web:latest
    container_name: randomsitcom-web-prod
    ports:
      - "80:80"
    depends_on:
      - api-prod
    restart: unless-stopped
    profiles: ["prod"]

volumes:
  mysqldata:
